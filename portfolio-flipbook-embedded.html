<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Samples</title>
   <style>
/* ======================================================
   ROOT + RESET
====================================================== */
:root {
  --primary: #2C5F7C;
  --accent: #17A2B8;
  --light: #f8f9fa;
  --dark: #212529;
  --gray: #6c757d;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

/* ======================================================
   BODY (NO PAGE SCROLL — iframe-safe)
====================================================== */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: var(--dark);
  line-height: 1.6;
  height: 100%;
  overflow: hidden; /* 🔒 prevent iframe scroll */
}

/* ======================================================
   FLIPBOOK CONTAINER (FULL HEIGHT SHELL)
====================================================== */
.flipbook-container {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

/* ======================================================
   TOC NAV (HORIZONTAL SCROLL)
====================================================== */
.toc-nav {
  background: #ffffff;
  border-bottom: 1px solid #e9ecef;
  padding: 0.6rem 0.75rem;
  overflow: visible;
}

.toc-nav-inner {
  display: flex;
  gap: 0.75rem;
  overflow-x: auto;
  overflow-y: visible;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  align-items: center;
}

/* TOC Menu Buttons */
.toc-menu {
  display: flex;
  flex-direction: column;
  flex: 0 0 auto;
}

.toc-menu-btn {
  background: transparent;
  border: none;
  color: var(--primary);
  font-weight: 600;
  font-size: 0.9rem;
  padding: 0.35rem 0.15rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}

.toc-menu-btn:hover,
.toc-menu.open .toc-menu-btn {
  border-bottom-color: var(--accent);
}

/* Dropdown */
.toc-dropdown {
  display: none;
  margin-top: 0.4rem;
  background: #ffffff;
  border: 1px solid #e1e5ea;
  border-radius: 10px;
  padding: 0.5rem;
  min-width: 220px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.toc-menu.open .toc-dropdown {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.toc-link {
  background: #f8f9fa;
  border: 1px solid #e1e5ea;
  border-radius: 8px;
  padding: 0.45rem 0.6rem;
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--dark);
  text-align: left;
}

.toc-link:hover {
  background: var(--accent);
  color: #ffffff;
}

.toc-link.active {
  background: var(--primary);
  color: #ffffff;
}

/* ======================================================
   MAIN CONTENT (SINGLE SCROLL REGION)
====================================================== */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.content-display {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow-y: auto; /* single vertical scrollbar */
}

.content-header {
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--light);
}

.section-label {
  color: var(--gray);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.content-header h2 {
  color: var(--primary);
  font-size: 1.6rem;
}

.caption {
  color: var(--accent);
  font-style: italic;
}

/* ======================================================
   CONTENT BODY
====================================================== */
.content-body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.blurb {
  margin-bottom: 1rem;
  line-height: 1.7;
}

/* ======================================================
   WHY BOX (OPTIONAL ACCORDION-READY)
====================================================== */
.why-box {
  background: var(--light);
  padding: 1rem;
  border-radius: 6px;
  border-left: 4px solid var(--accent);
  margin-bottom: 1.25rem;
  font-size: 0.95rem;
}

/* ======================================================
   PDF VIEWER (KEY FIX)
====================================================== */
.pdf-viewer {
  flex: 1 1 auto;
  min-height: 520px; /* adjust if needed */
  border: 2px solid var(--light);
  border-radius: 8px;
  overflow: hidden;
  background: #f5f5f5;
  display: flex;
}

.pdf-viewer iframe,
.pdf-viewer object {
  flex: 1 1 auto;
  width: 100%;
  height: auto;
  border: none;
}

/* ======================================================
   BOTTOM NAV
====================================================== */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background: var(--primary);
  color: #ffffff;
  border-top: 3px solid var(--accent);
}

.nav-btn {
  background: #ffffff;
  color: var(--primary);
  border: none;
  padding: 0.6rem 1.5rem;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
}

.nav-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* ======================================================
   SCROLLBAR STYLING (GLOBAL)
====================================================== */
*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

*::-webkit-scrollbar-track {
  background: rgba(23, 162, 184, 0.08);
  border-radius: 999px;
}

*::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--accent), var(--primary));
  border-radius: 999px;
  border: 2px solid rgba(255,255,255,0.6);
}

*::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, var(--primary), var(--accent));
}

/* ======================================================
   MOBILE
====================================================== */
@media (max-width: 768px) {
  .content-display {
    padding: 1rem;
  }

  .pdf-viewer {
    min-height: 55vh;
  }

  .nav-bar {
    padding: 0.75rem 1rem;
  }
}
</style>

</head>
<body>
  <div class="flipbook-container">

   <!-- TOC NAV BAR -->
<div class="toc-nav">
  <div class="toc-nav-inner">

    <div class="toc-menu">
      <button class="toc-menu-btn" type="button">🎓 Program & Session Design</button>
      <div class="toc-dropdown">
        <button class="toc-link" data-page="0" type="button">Instructor Guide</button>
        <button class="toc-link" data-page="1" type="button">Weekly Structure & Pacing</button>
      </div>
    </div>

    <div class="toc-menu">
      <button class="toc-menu-btn" type="button">🗺️ Curriculum Maps & Overviews</button>
      <div class="toc-dropdown">
        <button class="toc-link" data-page="2" type="button">Learning Outcomes Map</button>
        <button class="toc-link" data-page="3" type="button">Weekly Overviews</button>
      </div>
    </div>

    <div class="toc-menu">
      <button class="toc-menu-btn" type="button">📊 Assessment & Evaluation</button>
      <div class="toc-dropdown">
        <button class="toc-link" data-page="4" type="button">Diagnostic Assessment</button>
        <button class="toc-link" data-page="5" type="button">Writing Rubric</button>
        <button class="toc-link" data-page="6" type="button">Growth Tracking System</button>
      </div>
    </div>

    <div class="toc-menu">
      <button class="toc-menu-btn" type="button">📎 Learner-Facing Materials</button>
      <div class="toc-dropdown">
        <button class="toc-link" data-page="7" type="button">Learner Expectations</button>
        <button class="toc-link" data-page="8" type="button">Worksheets & Handouts</button>
        <button class="toc-link" data-page="9" type="button">Final Project Planner</button>
      </div>
    </div>

  </div>
</div>



    <!-- Main Content -->
    <div class="main-content">
      <div class="content-display" id="contentDisplay"></div>

      <div class="nav-bar">
        <button class="nav-btn" id="prevBtn">← Previous</button>
        <div><span id="currentPage">1</span> / <span id="totalPages">10</span></div>
        <button class="nav-btn" id="nextBtn">Next →</button>
      </div>
    </div>

  </div>


    <script>
  const pages = [
    /* 0 – Instructor Guide */
    {
      section: "🎓 Program & Session Design",
      title: "Instructor Guide: Introductory Digital Literacy Session",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp6.pdf",
      caption: "A facilitator-ready guide designed for adults new to both teaching and technology.",
      blurb: `
        <p>This instructor guide demonstrates how I design lessons for facilitators without prior teaching experience who are supporting learners with little or no digital background. It includes minute-by-minute pacing, facilitator language, troubleshooting guidance, and instructional cues grounded in psychological safety.</p>
        <p>The guide is intentionally written to support the facilitator as a learner as well—modeling how to teach the course while simultaneously teaching the course itself. By anticipating common points of confusion, anxiety, and skill gaps on both sides of the room, the design helps facilitators lead with confidence and clarity from day one.</p>
      `,
      why: "This sample shows my ability to design instructor-facing materials that train facilitators how to teach, not just what to teach—an essential skill for scalable programs, facilitator onboarding, and train-the-trainer environments."
    },

    /* 1 – Weekly Structure & Pacing */
    {
      section: "🎓 Program & Session Design",
      title: "Weekly Learning Structure & Pacing Guide",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp5.pdf",
      caption: "A predictable weekly rhythm designed to balance cognitive and emotional load.",
      blurb: `
        <p>This guide illustrates how I design a consistent, grounding learning rhythm across a multi-month, full-time program. The structure balances instruction, practice, reflection, and breaks to support cognitive load, emotional safety, and sustained engagement across multiple content areas.</p>
      `,
      why: "Demonstrates long-form curriculum planning and intentional sequencing that supports learner stamina, clarity, and follow-through over time."
    },

    /* 2 – Learning Outcomes Map */
    {
      section: "🗺️ Curriculum & Learning Design",
      title: "Learning Outcomes Map",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp1.pdf",
      caption: "A backward-designed outcomes map aligning an interdisciplinary adult-education program.",
      blurb: `
        <p>This outcomes map demonstrates backward design across three interconnected learning domains: knowledge, skills, and application. I created these outcomes to guide a 12-week, full-time program spanning leadership development, digital literacy, and financial wellness, ensuring clarity about what learners would understand, practice, and apply in real-world contexts.</p>
        <p>The structure supported instructional alignment across lessons, assessments, and facilitation decisions while honoring learners’ developmental progression over time.</p>
      `,
      why: "Demonstrates my ability to architect multi-domain learning experiences with clear, learner-centered, and measurable outcomes—applicable to program design, curriculum mapping, and competency-based training across sectors."
    },

    /* 3 – Weekly Overview Sheets */
    {
      section: "🗺️ Curriculum & Learning Design",
      title: "Weekly Overview Sheets (Instruction + Expectations)",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp4.pdf",
      caption: "Clear, learner-centered weekly plans supporting confidence, pacing, and follow-through.",
      blurb: `
        <p>These weekly overview sheets illustrate how I structured full-time instruction across leadership development, digital literacy, financial wellness, and career readiness while maintaining clarity about daily focus and expectations. Each overview integrates instructional topics, assessments, and homework into a predictable rhythm that helps learners stay oriented and prepared.</p>
        <p>The schedules also reflect iterative refinement: delivery methods and weekly flow were adjusted in response to learner feedback to better balance cognitive load, emotional demand, and practical application.</p>
      `,
      why: "Demonstrates my ability to design navigable, adaptable learning structures for adult learners—supporting consistency while remaining responsive to real learner experience."
    },

    /* 4 – Diagnostic Assessment */
    {
      section: "📊 Assessment & Evaluation Design",
      title: "Competency-Based Diagnostic Assessment (Pre/Post)",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp11.pdf",
      caption: "A multi-domain diagnostic designed to establish baseline readiness and measure growth over time.",
      blurb: `
        <p>This diagnostic assessment was designed to establish a clear baseline of learner skills at program entry and to support quantitative measurement of learning and development across the program. It evaluates digital literacy, reading comprehension, writing skills, and personal readiness using clearly defined competencies, structured item prompts, and transparent scoring criteria.</p>
        <p>The assessment intentionally blends technical knowledge checks, applied literacy tasks, and self-reflective readiness measures within a calm, non-shaming framework. This approach allowed instructors to identify skill gaps, tailor instructional support, and later compare results against a parallel post-assessment to measure growth across domains.</p>
      `,
      why: "Demonstrates my ability to design assessments that are both rigorous and humane—balancing measurement, equity, and learner dignity. Applicable to pre/post evaluation, skills validation, placement testing, onboarding diagnostics, and workforce readiness assessment."
    },

    /* 5 – Rubrics */
    {
      section: "📊 Assessment & Evaluation Design",
      title: "Reflective & Applied Skills Rubrics",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp3.pdf",
      caption: "Emotionally intelligent rubrics that balance accountability, growth, and learner dignity.",
      blurb: `
        <p>These rubrics were designed to support two distinct but equally important forms of learning: reflective leadership development and applied digital skill practice. The reflective writing rubric emphasizes depth, self-awareness, and authentic engagement rather than polish or perfection, providing learners with a clear, compassionate framework for exploring growth, setbacks, and insight.</p>
        <p>The applied digital skills rubric reinforces professional expectations—timeliness, clarity, and instruction-following—while still embedding support pathways and transparent criteria. Together, these tools create consistent expectations across emotionally complex and technically demanding work, without resorting to punitive or shaming evaluation.</p>
      `,
      why: "Demonstrates my ability to design assessment systems that honor both the emotional and practical dimensions of adult learning. Applicable to reflective practice, skills-based training, workforce development, professional communication, and performance-based evaluation."
    },

    /* 6 – Weekly Growth Tracking */
    {
      section: "📊 Assessment & Evaluation Design",
      title: "Weekly Growth-Tracking & Portfolio Evaluation System",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp7.pdf",
      caption: "A holistic assessment framework that documents learning journeys rather than penalizing struggle.",
      blurb: `
        <p>This assessment system was designed for a beginner digital literacy course facilitated by non-instructor coaches. It replaces traditional grading with structured observation, clear completion criteria, and portfolio-based evidence of growth. Weekly assessments focus on attendance, participation, handout completion, and brief qualitative growth notes—allowing facilitators to track progress without burdening learners or instructors.</p>
        <p>Homework verification emphasizes completion over correctness, using certificates and alternative pathways to ensure equity for learners with limited access. The course culminates in a portfolio-based final assessment that captures skill development, confidence, and applied learning across time rather than a single high-stakes test.</p>
        <p>The system also includes tiered recognition levels, offering multiple ways for learners to succeed and be acknowledged while maintaining transparent standards for completion.</p>
      `,
      why: "Demonstrates my ability to design scalable, humane assessment systems that work in real-world instructional contexts—especially those involving volunteer facilitators, adult beginners, or trauma-informed environments. Applicable to workforce development, onboarding, community education, and any program where growth, retention, and dignity matter as much as measurable outcomes."
    },

    /* 7 – Learner Expectations */
    {
      section: "📎 Learner-Facing Materials",
      title: "Learner Expectations, Policies, and Success Supports",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp2.pdf",
      caption: "Clear, humane guidance that sets high expectations without shame.",
      blurb: `
        <p>These learner-facing materials establish behavioral norms, participation expectations, and program policies using direct, supportive language designed for adults navigating high-stakes transition. Rather than relying on threat-based compliance, the document frames accountability as a shared commitment to growth, professionalism, and community care.</p>
        <p>The structure balances clarity with compassion: expectations are explicit, consequences are transparent, and support pathways are named repeatedly. Emotional maturity, communication, teamwork, and self-advocacy are treated as learnable skills—not assumed traits—while still maintaining firm standards required for progression through the program.</p>
        <p>This document also models how to communicate policies in trauma-aware environments: firm without being punitive, inclusive without being vague, and grounded in respect for learner autonomy.</p>
      `,
      why: "Demonstrates my ability to design learner-facing communication that reinforces belonging, accountability, and behavioral clarity simultaneously. Applicable to onboarding, workforce development, higher education syllabi, employee handbooks, and any learning environment where tone directly impacts engagement and retention."
    },

    /* 8 – Worksheets & Handouts */
    {
      section: "📎 Learner-Facing Materials",
      title: "Digital Literacy Worksheets & Handouts (Selected Samples)",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp9.pdf",
      caption: "Plain-language, confidence-building materials designed for true beginners.",
      blurb: `
        <p>These learner-facing worksheets demonstrate how I translate technical skills into accessible, emotionally supportive learning experiences. Each handout uses clear objectives (“Today I will learn…”), step-by-step task framing, visual checklists, and encouraging language to reduce intimidation and build momentum.</p>
        <p>Rather than assuming prior knowledge, the materials normalize confusion, reinforce mastery through small wins, and explicitly connect skills to real-life use (emailing, file management, time planning, online safety). Reflection prompts and celebration moments are intentionally embedded to support self-efficacy, not just task completion.</p>
        <p>Design choices prioritize cognitive load management, readability, and emotional safety: limited text density, consistent structure, friendly microcopy, and action-oriented language that positions learners as capable from the start.</p>
      `,
      why: "Demonstrates my ability to design learner-facing materials that reduce anxiety, scaffold confidence, and support skill transfer. Applicable to digital upskilling, software onboarding, workforce training, adult education, and any context where learners may feel intimidated by new systems or tools."
    },

    /* 9 – Final Project Planner */
    {
      section: "📎 Learner-Facing Materials",
      title: "Final Project Showcase Planner & Presentation Guide",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp8.pdf",
      caption: "A confidence-centered capstone scaffold that helps learners name, share, and celebrate their growth.",
      blurb: `
        <p>This final project planner guides learners through choosing a meaningful showcase format, organizing their work, and preparing to present with confidence. Rather than prescribing a single “correct” output, the guide offers multiple project pathways (career-focused, reflective, creative, or exploratory), allowing learners to align their presentation with their goals and strengths.</p>
        <p>Built-in reflection prompts help learners articulate not just what they created, but how they grew — technically, personally, and emotionally. Presentation checklists and confidence-building supports reduce performance anxiety, normalize nervousness, and reinforce the idea that sharing work is a skill that can be practiced, not a test to be passed.</p>
        <p>Peer-feedback guidance is intentionally included to cultivate a supportive learning community and help learners practice giving and receiving feedback with respect and care.</p>
      `,
      why: "Demonstrates my ability to design capstone experiences that build confidence, metacognition, and communication skills — especially for learners who may not yet see themselves as “capable” or “technical.” Applicable to program culminations, professional development portfolios, project-based learning, and workforce training contexts where growth needs to be visible, affirming, and transferable."
    }
  ];

  let currentPage = 0;

  // Cache TOC elements FIRST (so loadPage can safely use them)
  const menus = document.querySelectorAll('.toc-menu');
  const menuButtons = document.querySelectorAll('.toc-menu-btn');
  const tocLinks = document.querySelectorAll('.toc-link');

  function setActiveLink(index) {
    tocLinks.forEach(link => link.classList.remove('active'));
    const activeLink = document.querySelector(`.toc-link[data-page="${index}"]`);
    if (activeLink) activeLink.classList.add('active');
  }

  function loadPage(index) {
    const page = pages[index];
    const display = document.getElementById('contentDisplay');

    display.innerHTML = `
      <div class="content-header">
        <div class="section-label">${page.section}</div>
        <h2>${page.title}</h2>
        <p class="caption">${page.caption}</p>
      </div>

      <div class="content-body">
        <div class="blurb">${page.blurb}</div>
        <div class="why-box"><strong>Why this matters:</strong> ${page.why}</div>

        <div class="pdf-viewer">
          <iframe src="${page.file}" title="${page.title}"></iframe>
        </div>
      </div>
    `;

    currentPage = index;
    document.getElementById('currentPage').textContent = index + 1;
    document.getElementById('prevBtn').disabled = index === 0;
    document.getElementById('nextBtn').disabled = index === pages.length - 1;

    setActiveLink(index);
  }

  document.getElementById('totalPages').textContent = pages.length;

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 0) loadPage(currentPage - 1);
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentPage < pages.length - 1) loadPage(currentPage + 1);
  });

  // Dropdown toggles
  menuButtons.forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const menu = e.target.closest('.toc-menu');
      menus.forEach(m => { if (m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
  });

  // Click a link -> load page + close dropdowns
  tocLinks.forEach((link) => {
    link.addEventListener('click', () => {
      const pageIndex = parseInt(link.dataset.page, 10);
      loadPage(pageIndex);
      menus.forEach(m => m.classList.remove('open'));
    });
  });

  // Close if clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.toc-nav')) {
      menus.forEach(m => m.classList.remove('open'));
    }
  });

  // Initial load
  loadPage(0);
</script>


</body>
</html>
