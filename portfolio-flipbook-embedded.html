<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Samples</title>
    <style>
        :root {
            --primary: #2C5F7C;
            --accent: #17A2B8;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        html, body {
    height: 100%;
}
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--dark);
            line-height: 1.6;
            height: 100%;
        }

        /* Main Container */
        .flipbook-container {
            min-height: 2400px;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        /* TOC Header Section */
        .toc-header {
            background: var(--light);
            padding: 1.5rem;
            border-bottom: 2px solid #dee2e6;
        }

        .toc-header h3 {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            text-align: center;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 0.5rem;
        }

        /* 4 Column Grid */
        .toc-boxes {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 1rem;
        }

        .toc-box {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border-top: 4px solid var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .toc-box h4 {
            color: var(--primary);
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            text-align: center;
            font-weight: 700;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--light);
        }

        .toc-box-items {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .toc-item {
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.2s;
            color: var(--dark);
            text-align: center;
        }

        .toc-item:hover {
            background: var(--light);
            color: var(--primary);
        }

        .toc-item.active {
            background: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .content-display {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .content-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--light);
            flex-shrink: 0;
        }

        .content-header .section-label {
            color: var(--gray);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .content-header h2 {
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .content-header .caption {
            color: var(--accent);
            font-style: italic;
        }

        .content-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .blurb {
            margin-bottom: 1rem;
            line-height: 1.7;
            flex-shrink: 0;
        }

        .why-box {
            background: var(--light);
            padding: 1rem;
            border-radius: 5px;
            border-left: 4px solid var(--accent);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .why-box strong {
            color: var(--primary);
        }

        /* PDF Viewer */
        .pdf-viewer {
    flex: 0 0 auto;      /* don’t rely on flex-grow here */
    height: 75vh;        /* adjust: try 70–80vh to taste */
    border: 2px solid var(--light);
    border-radius: 8px;
    overflow: hidden;
    background: #f5f5f5;
}

.pdf-viewer object,
.pdf-viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
}

        /* Navigation */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            border-top: 3px solid var(--accent);
            flex-shrink: 0;
        }

        .nav-btn {
            background: white;
            color: var(--primary);
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--accent);
            color: white;
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Mobile */
        @media (max-width: 968px) {
            .toc-boxes {
                grid-template-columns: 1fr;
            }
            
            .flipbook-container {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="flipbook-container">
        <!-- TOC Section -->
        <div class="toc-header">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="margin: 0; border: none; padding: 0;">Portfolio Samples</h3>
        <button id="toggleTOC" style="background: var(--accent); color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; font-weight: 600;">Hide TOC ▲</button>
    </div>
            <div class="toc-boxes">
                <!-- Box 1 -->
                <div class="toc-box">
                    <h4>🎓 Facilitator Guides</h4>
                    <div class="toc-box-items">
                        <div class="toc-item" data-page="0">Instructor Guide</div>
                        <div class="toc-item" data-page="1">Learner Expectations</div>
                    </div>
                </div>

                <!-- Box 2 -->
                <div class="toc-box">
                    <h4>🌿 Curriculum Design</h4>
                    <div class="toc-box-items">
                        <div class="toc-item" data-page="2">Outcomes Map</div>
                        <div class="toc-item" data-page="3">Learning Structure</div>
                        <div class="toc-item" data-page="4">Weekly Overviews</div>
                    </div>
                </div>

                <!-- Box 3 -->
                <div class="toc-box">
                    <h4>📝 Assessment Design</h4>
                    <div class="toc-box-items">
                        <div class="toc-item" data-page="5">Diagnostic</div>
                        <div class="toc-item" data-page="6">Writing Rubric</div>
                        <div class="toc-item" data-page="7">Growth Tracking</div>
                    </div>
                </div>

                <!-- Box 4 -->
                <div class="toc-box">
                    <h4>💻 Digital Literacy</h4>
                    <div class="toc-box-items">
                        <div class="toc-item" data-page="8">Worksheets</div>
                        <div class="toc-item" data-page="9">Project Showcase</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-display" id="contentDisplay"></div>
            
            <div class="nav-bar">
                <button class="nav-btn" id="prevBtn">← Previous</button>
                <div><span id="currentPage">1</span> / <span id="totalPages">10</span></div>
                <button class="nav-btn" id="nextBtn">Next →</button>
            </div>
        </div>
    </div>

    <script>
        const pages = [
            {
                section: "🎓 Facilitator Guides & Support Materials",
                title: "Instructor Guide: Introductory Digital Literacy Session",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp6.pdf",
                caption: "A trauma-informed, facilitator-ready guide for true beginners in digital skills.",
                blurb: "This guide demonstrates how I create accessible lessons for adults with little or no digital experience. It includes minute-by-minute pacing, facilitator language, troubleshooting support, and instructional cues rooted in psychological safety. My focus is always on reducing anxiety and building early confidence.",
                why: "Highlights my ability to design instructor-facing materials that support effective teaching and learner dignity."
            },
            {
                section: "🎓 Facilitator Guides & Support Materials",
                title: "Learner Expectations, Policies, and Success Supports",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp2.pdf",
                caption: "Warm, clear communication that sets structure without shame.",
                blurb: "These learner-facing pages show how I communicate expectations with clarity and compassion. The tone is supportive rather than punitive and reinforces belonging, accountability, and mutual respect in the learning environment.",
                why: "Demonstrates my mastery of learner-facing microcopy and tone — one of my strongest skills."
            },
            {
                section: "🌿 Curriculum & Learning Design",
                title: "Learning Outcomes Map",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp1.pdf",
                caption: "A backward-designed outcomes map aligning an interdisciplinary adult-education program.",
                blurb: "This outcomes map demonstrates backward design across three domains of learning. I created layered knowledge, skill, and application outcomes to guide a 12-week program. These outcomes ensured instructional alignment between lessons, assessments, and each learner's developmental arc.",
                why: "Shows my ability to architect multi-domain learning experiences using clear, measurable outcomes."
            },
            {
                section: "🌿 Curriculum & Learning Design",
                title: "Weekly Learning Structure & Pacing Guide",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp5.pdf",
                caption: "A predictable weekly rhythm designed to balance cognitive and emotional load.",
                blurb: "This weekly structure illustrates how I design a consistent, grounding learning rhythm across a multi-month program. The pacing supports cognitive load, emotional safety, and alignment of multiple content areas without overwhelming learners.",
                why: "Demonstrates long-form curriculum planning and thoughtful sequencing."
            },
            {
                section: "🌿 Curriculum & Learning Design",
                title: "Weekly Overview Sheets (Instruction + Expectations)",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp4.pdf",
                caption: "Clear, learner-centered week plans supporting confidence and preparedness.",
                blurb: "These weekly overview sheets show how I organize instruction across multiple topics while keeping expectations transparent and manageable. Each overview blends pacing, learning goals, and homework guidance to help learners stay oriented and confident.",
                why: "Shows my ability to design navigable, supportive structures for adult learners."
            },
            {
                section: "📝 Assessment & Evaluation Design",
                title: "Competency-Based Diagnostic Assessment",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp11.pdf",
                caption: "A multi-domain diagnostic designed to meet learners where they are.",
                blurb: "This diagnostic assessment evaluates reading comprehension, writing skills, digital literacy, and personal readiness in a calm, non-shaming framework. I created the competency definitions, item prompts, and rubric to support equitable, growth-centered evaluation for adults beginning a new learning journey.",
                why: "Assessment design is a high-impact ID skill; this sample demonstrates both rigor and empathy."
            },
            {
                section: "📝 Assessment & Evaluation Design",
                title: "Reflective Writing Rubric",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp3.pdf",
                caption: "An emotionally intelligent rubric that supports depth and authentic reflection.",
                blurb: "This rubric was designed to encourage thoughtful, vulnerable, and growth-oriented reflection. It rewards engagement rather than perfection and gives learners a clear, compassionate structure for talking about their development.",
                why: "Shows my ability to design assessments that honor the emotional dimensions of learning."
            },
            {
                section: "📝 Assessment & Evaluation Design",
                title: "Weekly Growth-Tracking & Portfolio Evaluation System",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp7.pdf",
                caption: "A holistic assessment system that documents progress rather than penalizing struggle.",
                blurb: "This system combines weekly observational assessments, simple homework verification, and a portfolio-based final evaluation. It gives instructors an efficient framework for tracking progress, while offering learners a motivating, low-pressure way to see their growth over time.",
                why: "Demonstrates full-cycle assessment design that is transparent, humane, and scalable."
            },
            {
                section: "💻 Digital Literacy Learning Materials",
                title: "Digital Literacy Worksheets & Handouts (Selected Samples)",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp9.pdf",
                caption: "Friendly, plain-language materials that help digital beginners build confidence.",
                blurb: "These worksheets reflect my approach to making technical learning feel accessible and doable. Each handout blends clear instructions, practical skill-building, and psychologically supportive framing. The design is simple, visual, and welcoming for learners who are new to computers.",
                why: "Shows my ability to reduce cognitive load and design for learners who may feel intimidated by technology."
            },
            {
                section: "💻 Digital Literacy Learning Materials",
                title: "Final Project Showcase Planner & Presentation Guide",
                file: "https://itsmekitb.github.io/itsmekitb/PortSamp8.pdf",
                caption: "A supportive scaffold for preparing and presenting a learner's final project.",
                blurb: "This planning guide helps learners articulate their progress, organize their work, and present their learning in a structured, confidence-building way. It supports both metacognition and communication skills without adding pressure or complexity.",
                why: "Demonstrates my ability to design capstone experiences and reflection activities for adult learners."
            }
        ];

        let currentPage = 0;

        function loadPage(index) {
            const page = pages[index];
            const display = document.getElementById('contentDisplay');
            
            display.innerHTML = `
                <div class="content-header">
                    <div class="section-label">${page.section}</div>
                    <h2>${page.title}</h2>
                    <p class="caption">${page.caption}</p>
                </div>
                <div class="content-body">
                    <p class="blurb">${page.blurb}</p>
                    <div class="why-box"><strong>Why this matters:</strong> ${page.why}</div>
                    <div class="pdf-viewer">
                        <object data="${page.file}" type="application/pdf">
                            <iframe src="${page.file}"></iframe>
                        </object>
                    </div>
                </div>
            `;
            
            currentPage = index;
            document.getElementById('currentPage').textContent = index + 1;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === pages.length - 1;
            
            document.querySelectorAll('.toc-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`[data-page="${index}"]`).classList.add('active');
        }

        document.getElementById('totalPages').textContent = pages.length;
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 0) loadPage(currentPage - 1);
        });
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentPage < pages.length - 1) loadPage(currentPage + 1);
        });
        
        document.querySelectorAll('.toc-item').forEach(item => {
            item.addEventListener('click', () => {
                loadPage(parseInt(item.dataset.page));
            });
        });
        
        loadPage(0);

        // TOC Toggle functionality
const tocHeader = document.querySelector('.toc-header');
const tocBoxes = document.querySelector('.toc-boxes');
const toggleBtn = document.getElementById('toggleTOC');
let tocVisible = true;

toggleBtn.addEventListener('click', () => {
    tocVisible = !tocVisible;
    if (tocVisible) {
        tocBoxes.style.display = 'grid';
        toggleBtn.textContent = 'Hide TOC ▲';
    } else {
        tocBoxes.style.display = 'none';
        toggleBtn.textContent = 'Show TOC ▼';
    }
});

// Auto-collapse when TOC item is clicked
document.querySelectorAll('.toc-item').forEach(item => {
    const originalClick = item.onclick;
    item.addEventListener('click', () => {
        tocVisible = false;
        tocBoxes.style.display = 'none';
        toggleBtn.textContent = 'Show TOC ▼';
    });
});
    </script>
</body>
</html>
