<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Samples</title>
    <style>
    :root {
        --primary: #2C5F7C;
        --accent: #17A2B8;
        --light: #f8f9fa;
        --dark: #212529;
        --gray: #6c757d;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: var(--dark);
  line-height: 1.6;
  height: 100%;
  overflow: hidden; /* keep no page scroll inside the iframe */
        
    }

    /* Main Container */
    .flipbook-container {
  height: 100%;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: white;
  border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}


    /* TOC Header Section */
    .toc-header {
        background: var(--light);
        padding: 1.5rem;
        border-bottom: 2px solid #dee2e6;
    }

    .toc-header h3 {
        color: var(--primary);
        font-size: 1.1rem;
        margin-bottom: 1rem;
        text-align: center;
        border-bottom: 3px solid var(--accent);
        padding-bottom: 0.5rem;
    }

/* === TOC NAV BAR with dropdowns === */
.toc-nav {
  background: var(--light);
  border-bottom: 2px solid #dee2e6;
  padding: 0.75rem 1rem;
}

.toc-nav-inner {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;          /* allows wrapping on smaller screens */
  align-items: center;
}

.toc-menu {
  position: relative;
}

.toc-menu-btn {
  background: white;
  border: 2px solid var(--accent);
  color: var(--primary);
  font-weight: 700;
  font-size: 0.85rem;
  padding: 0.5rem 0.9rem;
  border-radius: 999px;
  cursor: pointer;
}

.toc-dropdown {
  display: none;
  position: absolute;
  left: 0;
  top: calc(100% + 0.4rem);
  background: white;
  border: 1px solid #e1e5ea;
  border-radius: 10px;
  padding: 0.5rem;
  min-width: 220px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  z-index: 1000;
}

.toc-menu.open .toc-dropdown {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.toc-link {
  text-align: left;
  background: #f8f9fa;
  border: 1px solid #e1e5ea;
  border-radius: 8px;
  padding: 0.45rem 0.6rem;
  cursor: pointer;
  font-size: 0.85rem;
}

.toc-link:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.toc-link.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

/* Mobile: make dropdowns full-width-ish so they’re usable */
@media (max-width: 699px) {
  .toc-nav-inner {
    flex-direction: column;
    align-items: stretch;
  }

  .toc-menu-btn {
    width: 100%;
    text-align: left;
  }

  .toc-dropdown {
    position: static;
    min-width: unset;
    margin-top: 0.4rem;
  }
}


    /* Main Content Area */
    .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .content-display {
        flex: 1;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .content-header {
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--light);
        flex-shrink: 0;
    }

    .content-header .section-label {
        color: var(--gray);
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 0.5rem;
    }

    .content-header h2 {
        color: var(--primary);
        font-size: 1.6rem;
        margin-bottom: 0.5rem;
    }

    .content-header .caption {
        color: var(--accent);
        font-style: italic;
    }

    .content-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .blurb {
        margin-bottom: 1rem;
        line-height: 1.7;
        flex-shrink: 0;
    }

    .why-box {
        background: var(--light);
        padding: 1rem;
        border-radius: 5px;
        border-left: 4px solid var(--accent);
        margin-bottom: 1.5rem;
        font-size: 0.95rem;
        flex-shrink: 0;
    }

    .why-box strong {
        color: var(--primary);
    }

    /* PDF Viewer */
    .pdf-viewer {
  flex: 1 1 auto;
  min-height: 320px;
  border: 2px solid var(--light);
  border-radius: 8px;
  overflow: hidden;
  background: #f5f5f5;
}

    .pdf-viewer object,
    .pdf-viewer iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* Navigation */
    .nav-bar {
        position: sticky;
        bottom: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        background: var(--primary);
        color: white;
        border-top: 3px solid var(--accent);
        flex-shrink: 0;
    }

    .nav-btn {
        background: white;
        color: var(--primary);
        border: none;
        padding: 0.6rem 1.5rem;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .nav-btn:hover:not(:disabled) {
        background: var(--accent);
        color: white;
        transform: translateY(-2px);
    }

    .nav-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    /* Mobile */
   /* Wide: 4 across */
@media (min-width: 1100px) {
    .toc-boxes {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* Medium: 2 across */
@media (min-width: 700px) and (max-width: 1099px) {
    .toc-boxes {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Small: 1 per row */
@media (max-width: 699px) {
    .toc-boxes {
        grid-template-columns: 1fr;
    }

    .flipbook-container {
        height: auto;
    }
}



/* --- TOC layout override: make items horizontal pills --- */
.toc-box-items {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 0.4rem !important;
    justify-content: center !important;
}

.toc-item {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    padding: 0.35rem 0.75rem !important;
    border-radius: 999px !important;  /* pill shape */
    font-size: 0.8rem !important;
    background: #f8f9fa !important;
    border: 1px solid #e1e5ea !important;
    color: var(--dark) !important;
    text-align: center;
    flex: 0 1 auto !important;
}

        /* --- Mobile TOC shrink (compact mode) --- */
@media (max-width: 699px) {

  /* tighten the whole top area */
  .toc-header {
    padding: 0.75rem !important;
  }

  /* if you're NOT using .toc-header wrapper right now, this still helps */
  .flipbook-container > h3 {
    font-size: 0.95rem !important;
    margin: 0.5rem 0 0.5rem !important;
  }

  /* make the TOC grid tighter */
  .toc-boxes {
    gap: 0.5rem !important;
  }

  /* shrink each TOC box */
  .toc-box {
    padding: 0.6rem !important;
    border-radius: 8px !important;
  }

  /* shrink the TOC box headings */
  .toc-box h4 {
    font-size: 0.75rem !important;
    margin-bottom: 0.45rem !important;
    padding-bottom: 0.35rem !important;
  }

  /* make the pills smaller + reduce wrapping space */
  .toc-box-items {
    gap: 0.3rem !important;
  }

  .toc-item {
    font-size: 0.72rem !important;
    padding: 0.22rem 0.55rem !important;
    border-radius: 999px !important;
  }

  /* optional: give the content more room on mobile */
  .content-display {
    padding: 1rem !important;
  }

  .content-header h2 {
    font-size: 1.25rem !important;
  }

  .pdf-viewer {
    height: 55vh !important;
  }

  .nav-bar {
    padding: 0.75rem 1rem !important;
  }

  .nav-btn {
    padding: 0.5rem 1rem !important;
  }
}

        
</style>
</head>
<body>
  <div class="flipbook-container">

   <!-- TOC NAV BAR -->
<div class="toc-nav">
  <div class="toc-nav-inner">

    <div class="toc-menu">
      <button class="toc-menu-btn" type="button">🎓 Program & Session Design</button>
      <div class="toc-dropdown">
        <button class="toc-link" data-page="0" type="button">Instructor Guide</button>
        <button class="toc-link" data-page="1" type="button">Weekly Structure & Pacing</button>
      </div>
    </div>

    <div class="toc-menu">
      <button class="toc-menu-btn" type="button">🗺️ Curriculum Maps & Overviews</button>
      <div class="toc-dropdown">
        <button class="toc-link" data-page="2" type="button">Learning Outcomes Map</button>
        <button class="toc-link" data-page="3" type="button">Weekly Overviews</button>
      </div>
    </div>

    <div class="toc-menu">
      <button class="toc-menu-btn" type="button">📊 Assessment & Evaluation</button>
      <div class="toc-dropdown">
        <button class="toc-link" data-page="4" type="button">Diagnostic Assessment</button>
        <button class="toc-link" data-page="5" type="button">Writing Rubric</button>
        <button class="toc-link" data-page="6" type="button">Growth Tracking System</button>
      </div>
    </div>

    <div class="toc-menu">
      <button class="toc-menu-btn" type="button">📎 Learner-Facing Materials</button>
      <div class="toc-dropdown">
        <button class="toc-link" data-page="7" type="button">Learner Expectations</button>
        <button class="toc-link" data-page="8" type="button">Worksheets & Handouts</button>
        <button class="toc-link" data-page="9" type="button">Final Project Planner</button>
      </div>
    </div>

  </div>
</div>



    <!-- Main Content -->
    <div class="main-content">
      <div class="content-display" id="contentDisplay"></div>

      <div class="nav-bar">
        <button class="nav-btn" id="prevBtn">← Previous</button>
        <div><span id="currentPage">1</span> / <span id="totalPages">10</span></div>
        <button class="nav-btn" id="nextBtn">Next →</button>
      </div>
    </div>

  </div>


    <script>
  const pages = [
    /* 0 – Instructor Guide */
    {
      section: "🎓 Program & Session Design",
      title: "Instructor Guide: Introductory Digital Literacy Session",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp6.pdf",
      caption: "A trauma-informed, facilitator-ready guide for true beginners in digital skills.",
      blurb: "This guide demonstrates how I create accessible lessons for adults with little or no digital experience. It includes minute-by-minute pacing, facilitator language, troubleshooting support, and instructional cues rooted in psychological safety. My focus is always on reducing anxiety and building early confidence.",
      why: "Shows I can create instructor-facing materials that support both teaching effectiveness and learner dignity; critical for facilitator training, faculty development, and train-the-trainer programs."
    },
    {
      section: "🎓 Program & Session Design",
      title: "Weekly Learning Structure & Pacing Guide",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp5.pdf",
      caption: "A predictable weekly rhythm designed to balance cognitive and emotional load.",
      blurb: "This weekly structure illustrates how I design a consistent, grounding learning rhythm across a multi-month program. The pacing supports cognitive load, emotional safety, and alignment of multiple content areas without overwhelming learners.",
      why: "Demonstrates long-form curriculum planning and thoughtful sequencing."
    },
    {
      section: "🗺️ Curriculum & Learning Design",
      title: "Learning Outcomes Map",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp1.pdf",
      caption: "A backward-designed outcomes map aligning an interdisciplinary adult-education program.",
      blurb: "This outcomes map demonstrates backward design across three domains of learning. I created layered knowledge, skill, and application outcomes to guide a 12-week program. These outcomes ensured instructional alignment between lessons, assessments, and each learner's developmental arc.",
      why: "Demonstrates ability to architect multi-domain learning experiences with clear, measurable outcomes. Applicable to program design, curriculum mapping, and competency-based training across contexts."
    },
    {
      section: "🗺️ Curriculum & Learning Design",
      title: "Weekly Overview Sheets (Instruction + Expectations)",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp4.pdf",
      caption: "Clear, learner-centered week plans supporting confidence and preparedness.",
      blurb: "These weekly overview sheets show how I organize instruction across multiple topics while keeping expectations transparent and manageable. Each overview blends pacing, learning goals, and homework guidance to help learners stay oriented and confident.",
      why: "Shows my ability to design navigable, supportive structures for adult learners."
    },
    {
      section: "📊 Assessment & Evaluation Design",
      title: "Competency-Based Diagnostic Assessment",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp11.pdf",
      caption: "A multi-domain diagnostic designed to meet learners where they are.",
      blurb: "This diagnostic assessment evaluates reading comprehension, writing skills, digital literacy, and personal readiness in a calm, non-shaming framework. I created the competency definitions, item prompts, and rubric to support equitable, growth-centered evaluation for adults beginning a new learning journey.",
      why: "Assessment design is a high-impact design skill. This demonstrates I can create evaluations that are both rigorous and compassionate. Applicable to pre-assessments, skills validation, placement testing, or onboarding diagnostics."
    },
    {
      section: "📊 Assessment & Evaluation Design",
      title: "Reflective Writing Rubric",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp3.pdf",
      caption: "An emotionally intelligent rubric that supports depth and authentic reflection.",
      blurb: "This rubric was designed to encourage thoughtful, vulnerable, and growth-oriented reflection. It rewards engagement rather than perfection and gives learners a clear, compassionate structure for talking about their development.",
      why: "Shows my ability to design assessments that honor the emotional dimensions of learning."
    },
    {
      section: "📊 Assessment & Evaluation Design",
      title: "Weekly Growth-Tracking & Portfolio Evaluation System",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp7.pdf",
      caption: "A holistic assessment system that documents progress rather than penalizing struggle.",
      blurb: "This system combines weekly observational assessments, simple homework verification, and a portfolio-based final evaluation. It gives instructors an efficient framework for tracking progress, while offering learners a motivating, low-pressure way to see their growth over time.",
      why: "Demonstrates full-cycle assessment design that's transparent, humane, and scalable. Applicable to learning journeys, performance tracking, competency progressions, or portfolio-based evaluation in any context."
    },
    {
      section: "📎 Learner-Facing Materials",
      title: "Learner Expectations, Policies, and Success Supports",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp2.pdf",
      caption: "Warm, clear communication that sets structure without shame.",
      blurb: "These learner-facing pages show how I communicate expectations with clarity and compassion. The tone is supportive rather than punitive and reinforces belonging, accountability, and mutual respect in the learning environment.",
      why: "Demonstrates my mastery of learner-facing microcopy and tone — one of my strongest skills."
    },
    {
      section: "📎 Learner-Facing Materials",
      title: "Digital Literacy Worksheets & Handouts (Selected Samples)",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp9.pdf",
      caption: "Friendly, plain-language materials that help digital beginners build confidence.",
      blurb: "These worksheets reflect my approach to making technical learning feel accessible and doable. Each handout blends clear instructions, practical skill-building, and psychologically supportive framing. The design is simple, visual, and welcoming for learners who are new to computers.",
      why: "Demonstrates ability to reduce cognitive load and design for learner anxiety. Applicable to tech training, software onboarding, digital tool adoption, or any context where new systems or skills create overwhelm."
    },
    {
      section: "📎 Learner-Facing Materials",
      title: "Final Project Showcase Planner & Presentation Guide",
      file: "https://itsmekitb.github.io/itsmekitb/PortSamp8.pdf",
      caption: "A supportive scaffold for preparing and presenting a learner's final project.",
      blurb: "This planning guide helps learners articulate their progress, organize their work, and present their learning in a structured, confidence-building way. It supports both metacognition and communication skills without adding pressure or complexity.",
      why: "Demonstrates ability to design capstone experiences and metacognitive reflection activities. Applicable to program culminations, professional development portfolios, or project-based learning in any context."
    }
  ];

  let currentPage = 0;

  // Cache TOC elements FIRST (so loadPage can safely use them)
  const menus = document.querySelectorAll('.toc-menu');
  const menuButtons = document.querySelectorAll('.toc-menu-btn');
  const tocLinks = document.querySelectorAll('.toc-link');

  function setActiveLink(index) {
    tocLinks.forEach(link => link.classList.remove('active'));
    const activeLink = document.querySelector(`.toc-link[data-page="${index}"]`);
    if (activeLink) activeLink.classList.add('active');
  }

  function loadPage(index) {
    const page = pages[index];
    const display = document.getElementById('contentDisplay');

    display.innerHTML = `
      <div class="content-header">
        <div class="section-label">${page.section}</div>
        <h2>${page.title}</h2>
        <p class="caption">${page.caption}</p>
      </div>

      <div class="content-body">
        <p class="blurb">${page.blurb}</p>
        <div class="why-box"><strong>Why this matters:</strong> ${page.why}</div>

        <div class="pdf-viewer">
          <iframe src="${page.file}" title="${page.title}"></iframe>
        </div>
      </div>
    `;

    currentPage = index;
    document.getElementById('currentPage').textContent = index + 1;
    document.getElementById('prevBtn').disabled = index === 0;
    document.getElementById('nextBtn').disabled = index === pages.length - 1;

    setActiveLink(index);
  }

  document.getElementById('totalPages').textContent = pages.length;

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 0) loadPage(currentPage - 1);
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentPage < pages.length - 1) loadPage(currentPage + 1);
  });

  // Dropdown toggles
  menuButtons.forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const menu = e.target.closest('.toc-menu');
      menus.forEach(m => { if (m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
  });

  // Click a link -> load page + close dropdowns
  tocLinks.forEach((link) => {
    link.addEventListener('click', () => {
      const pageIndex = parseInt(link.dataset.page, 10);
      loadPage(pageIndex);
      menus.forEach(m => m.classList.remove('open'));
    });
  });

  // Close if clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.toc-nav')) {
      menus.forEach(m => m.classList.remove('open'));
    }
  });

  // Initial load
  loadPage(0);
</script>

</body>
</html>
